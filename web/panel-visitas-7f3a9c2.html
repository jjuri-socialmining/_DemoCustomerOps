<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Visitas</title>
<meta name="robots" content="noindex, nofollow">
<!--
  ─────────────────────────────────────────────────────────────────────────────
  PÁGINA DE REPORTE (URL secreta — solo para ti)
  Lee la planilla de visitas (vía Apps Script) y muestra el reporte acumulado.

  SEGURIDAD: este archivo NO contiene ninguna credencial. Te pide la URL de la
  app web y el token de LECTURA al abrir, y los guarda solo en tu navegador
  (localStorage). Por eso publicarlo es seguro: quien no tenga el token no ve
  ningún dato. El token que sí viaja en la página pública de captura es otro, y
  sólo sirve para agregar filas.
  Guía: tools/visit-tracker/SETUP.md
  ─────────────────────────────────────────────────────────────────────────────
-->
<style>
  :root{
    --bg:#0f1115; --panel:#161922; --panel2:#1c212c; --border:#262b36;
    --text:#e6e8ec; --muted:#9aa3b2; --accent:#5eb1ff; --green:#4ade80;
    --amber:#fbbf24; --red:#f87171;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;
  }
  header{
    padding:1.4rem 1.5rem;border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:1rem;flex-wrap:wrap;
  }
  header h1{margin:0;font-size:1.25rem;letter-spacing:-.02em}
  header .sp{flex:1}
  button{
    background:var(--panel2);color:var(--text);border:1px solid var(--border);
    border-radius:8px;padding:.5rem .9rem;font-size:.85rem;cursor:pointer;
    transition:border-color .15s;
  }
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);color:#06101f;border-color:var(--accent);font-weight:600}
  main{max-width:1200px;margin:0 auto;padding:1.5rem}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1rem;margin-bottom:1.5rem}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:1rem 1.1rem}
  .card .n{font-size:1.7rem;font-weight:700;letter-spacing:-.02em}
  .card .l{color:var(--muted);font-size:.8rem;margin-top:.2rem}
  .breakdowns{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1rem;margin-bottom:1.5rem}
  .bd{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:1rem 1.1rem}
  .bd h3{margin:0 0 .7rem;font-size:.9rem;color:var(--accent)}
  .bd .row{display:flex;justify-content:space-between;font-size:.85rem;padding:.2rem 0;color:var(--muted)}
  .bd .row b{color:var(--text);font-weight:600}
  .bar{height:6px;border-radius:4px;background:var(--accent);opacity:.5;margin-top:2px}
  .toolbar{display:flex;gap:.6rem;align-items:center;margin-bottom:.8rem;flex-wrap:wrap}
  input[type=text]{
    background:var(--panel);border:1px solid var(--border);border-radius:8px;
    color:var(--text);padding:.5rem .8rem;font-size:.85rem;min-width:220px;
  }
  .tablewrap{overflow:auto;max-height:62vh;border:1px solid var(--border);border-radius:10px}
  table{border-collapse:collapse;width:100%;font-size:.82rem}
  td{vertical-align:top}
  th,td{padding:.55rem .7rem;text-align:left;border-bottom:1px solid var(--border)}
  th{background:var(--panel2);color:var(--muted);position:sticky;top:0;font-weight:600;cursor:pointer;user-select:none}
  th:hover{color:var(--text)}
  tr:hover td{background:var(--panel)}
  .pill{display:inline-block;padding:.1rem .5rem;border-radius:20px;font-size:.72rem;border:1px solid var(--border)}
  .pill.cel{color:var(--green);border-color:rgba(74,222,128,.4)}
  .pill.pc{color:var(--accent);border-color:rgba(94,177,255,.4)}
  .pill.tab{color:var(--amber);border-color:rgba(251,191,36,.4)}
  .muted{color:var(--muted)}
  /* Gate (login de la llave) */
  .gate{max-width:440px;margin:8vh auto;background:var(--panel);border:1px solid var(--border);
    border-radius:14px;padding:2rem}
  .gate h2{margin:0 0 .4rem;font-size:1.2rem}
  .gate p{color:var(--muted);font-size:.88rem;margin:0 0 1.2rem}
  .gate label{display:block;font-size:.8rem;color:var(--muted);margin:.8rem 0 .3rem}
  .gate input{width:100%}
  .gate button{width:100%;margin-top:1.3rem}
  .err{color:var(--red);font-size:.83rem;margin-top:.8rem;min-height:1.2em}
  .center{text-align:center;color:var(--muted);padding:3rem 1rem}
  a{color:var(--accent)}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  "use strict";
  /* ═══════════ Origen de datos: Apps Script + Google Sheets ═══════════

     ANTES (JSONBin): un bin por visita. Listar la colección venía paginado de a
     10 y ENCADENADO —cada página necesitaba el id de la última de la anterior,
     o sea estrictamente secuencial— y recién después había que leer un bin por
     visita. Con 385 visitas eso daba ~424 requests para dibujar una tabla, y
     crecía con cada visita, para siempre. De ahí salieron el caché, la poda, el
     backoff, el freno compartido de 429 y la compactación semanal: unas 350
     líneas sosteniendo una herramienta mal elegida.

     AHORA: una fila por visita en una planilla, y leerlas todas es UN request.
     Nada de eso hace falta, así que nada de eso quedó. Esto es todo el acceso a
     datos del panel.

     Las credenciales siguen sin tocar el sitio: la URL y el token de lectura se
     escriben una vez y viven en el localStorage de este navegador. El token de
     lectura es distinto del que lleva la página pública — ese sólo agrega filas. */

  var LS_URL="__sigma_report_url", LS_TOK="__sigma_report_tok";
  var app = document.getElementById("app");
  var state = { rows:[], sortKey:"ts_iso", sortDir:-1, filter:"",
                vivo:(function(){ try{ return localStorage.getItem("__sigma_report_vivo")==="1"; }catch(e){ return false; } })(),
                ultima:0, _fails:0, _loading:0 };

  function endpoint(){ return localStorage.getItem(LS_URL)||""; }
  function token(){ return localStorage.getItem(LS_TOK)||""; }

  /* ───────────── GATE: pide URL de la app web + token de lectura ───────────── */
  function gate(msg){
    app.innerHTML =
      '<div class="gate">'+
        '<h2>🔒 Panel de Visitas</h2>'+
        '<p>Pegá la URL de tu aplicación web y el token de lectura. '+
          'Se guardan solo en este navegador, nunca en el sitio.</p>'+
        '<label>URL de la aplicación web (termina en /exec)</label>'+
          '<input id="g_url" type="text" placeholder="https://script.google.com/macros/s/.../exec">'+
        '<label>Token de lectura (READ_TOKEN)</label><input id="g_tok" type="text" placeholder="a1b2c3…">'+
        '<button class="primary" id="g_go">Entrar</button>'+
        '<div class="err">'+(msg||"")+'</div>'+
      '</div>';
    document.getElementById("g_go").onclick=function(){
      var u=document.getElementById("g_url").value.trim();
      var t=document.getElementById("g_tok").value.trim();
      if(!u||!t){ gate("Completá ambos campos."); return; }
      if(!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(u)){
        gate("Esa URL no parece la de la app web. Tiene que empezar con "+
             "https://script.google.com/macros/s/ y terminar en /exec."); return;
      }
      try{ localStorage.setItem(LS_URL,u); localStorage.setItem(LS_TOK,t); }catch(e){}
      load();
    };
    var pu=localStorage.getItem(LS_URL); if(pu) document.getElementById("g_url").value=pu;
  }
  function clearKey(){ try{localStorage.removeItem(LS_TOK);localStorage.removeItem(LS_URL);}catch(e){} gate("Credenciales borradas."); }

  /* ── "Empezar de 0" ──────────────────────────────────────────────
     Corte por fecha: el panel ignora todo lo anterior. Sirve para arrancar a
     medir una campaña desde cero SIN borrar nada — las visitas viejas siguen en
     la planilla para el análisis y la comparación semana contra semana. */
  var LS_CUT="__sigma_report_corte";
  function corte(){ return localStorage.getItem(LS_CUT)||""; }
  function trasElCorte(r){
    var c=corte(); if(!c) return true;
    return !!(r.ts_iso && r.ts_iso >= c);      // ISO 8601 ordena bien como texto
  }
  function sleep(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }

  /* ───────────── Acceso a la planilla ─────────────
     GET sin cabeceras propias a propósito: así es una "simple request" y no
     dispara el preflight OPTIONS, que Apps Script no contesta. /exec redirige a
     googleusercontent.com, y ese sí manda los CORS que dejan leer la respuesta. */
  function pedir(params){
    var u=endpoint(); if(!u) return Promise.reject(new Error("sin configurar"));
    var q="?token="+encodeURIComponent(token());
    Object.keys(params||{}).forEach(function(k){ q+="&"+k+"="+encodeURIComponent(params[k]); });
    return fetch(u+q,{redirect:"follow"}).then(function(r){
      if(!r.ok) throw new Error("http "+r.status);
      return r.json();
    }).then(function(j){
      if(!j||!j.ok){
        var e=new Error((j&&j.error)||"respuesta inesperada");
        if(/token/i.test(e.message)) e.fatal=true;      // credencial mala, no red
        throw e;
      }
      return j;
    });
  }

  function enviar(cuerpo){
    var u=endpoint(); if(!u) return Promise.reject(new Error("sin configurar"));
    return fetch(u,{
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},   // evita el preflight
      body:JSON.stringify(Object.assign({token:token()},cuerpo)),
      redirect:"follow"
    }).then(function(r){
      if(!r.ok) throw new Error("http "+r.status);
      return r.json();
    }).then(function(j){
      if(!j||!j.ok) throw new Error((j&&j.error)||"respuesta inesperada");
      return j;
    });
  }

  function load(silencioso){
    if(!endpoint()||!token()){ return gate(); }
    state.ultima=Date.now();
    if(!silencioso && !state.rows.length){
      app.innerHTML='<div class="center">Cargando…</div>';
    }
    state._loading=1;
    if(state.rows.length) render();      // el chip "actualizando" sin pisar la tabla

    return pedir({}).then(function(j){
      state.rows=j.registros||[];
      state._fails=j.ilegibles||0;       // filas cuyo JSON quedó corrupto
      state._loading=0;
      render();
    }).catch(function(e){
      state._loading=0;
      if(e.fatal){ return gate("Token de lectura rechazado. Revisá la URL y el token."); }
      if(silencioso) return;             // en vivo: se reintenta en la próxima vuelta
      app.innerHTML='<div class="center">Error al cargar: '+esc(e.message)+
        ' &nbsp; <button onclick="location.reload()">Reintentar</button></div>';
    });
  }

  /* ── Respaldo local ──────────────────────────────────────────────
     Los registros crudos, sin recortar a las columnas del CSV: el CSV pierde
     cualquier campo que el tracker sume después. */
  function bajarArchivo(){
    var hoy=new Date().toISOString();
    var dump={
      exportado_en: hoy,
      origen: endpoint(),
      total_registros: state.rows.length,
      ilegibles: state._fails||0,
      nota: state._fails ? "OJO: "+state._fails+" fila(s) con JSON ilegible, no incluidas."
                         : "Lectura completa.",
      registros: state.rows
    };
    var blob=new Blob([JSON.stringify(dump,null,2)],{type:"application/json;charset=utf-8"});
    var a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="archivo_visitas_"+hoy.slice(0,10)+".json";
    a.click();
    return dump.total_registros;
  }

  /* ── Respaldar y vaciar ──────────────────────────────────────────
     Ahora el vaciado es una sola llamada, y el backend copia la hoja a
     "respaldo-<fecha>" dentro de la misma planilla ANTES de borrar, y verifica
     que la copia cuadre. Igual bajamos el JSON local primero: dos respaldos en
     dos lugares distintos cuestan un click y evitan una tarde muy mala. */
  function respaldarYVaciar(){
    if(state._loading){ alert("Esperá a que termine de cargar."); return; }
    if(!state.rows.length){ alert("No hay registros para vaciar."); return; }

    var n=bajarArchivo();
    var ok=prompt(
      "Se descargó el respaldo con "+n+" registro(s).\n\n"+
      "Guardalo en ~/PKM/MarketingOps/data/visitas/ ANTES de seguir.\n\n"+
      "Esto vacía la hoja «visitas». El backend deja una copia como "+
      "«respaldo-<fecha>» en la misma planilla y la verifica antes de borrar.\n\n"+
      "Escribí VACIAR para confirmar:");
    if(String(ok||"").trim().toUpperCase()!=="VACIAR"){ return; }

    app.innerHTML='<div class="center">Vaciando…</div>';
    enviar({fn:"vaciar"}).then(function(j){
      try{ localStorage.removeItem(LS_CUT); }catch(e){}   // ya no hace falta ocultar nada
      state.rows=[];
      alert("Listo: "+j.borrados+" registro(s) borrados.\n"+
            (j.respaldo?"Copia en la hoja «"+j.respaldo+"».\n":"")+
            "\nEl panel arranca de cero.");
      load();
    }).catch(function(e){
      alert("No se vació: "+e.message+"\n\nNo se borró nada.");
      load();
    });
  }

  /* ───────────── Helpers de render ───────────── */

  /* Una VISITA es un pageview y nada más. Antes esto era «todo lo que no sea
     click», y alcanzaba mientras existieran sólo dos tipos de evento. Con las
     señales del chat (chat_foco, chat_tipeo, chat_envio, chat_abandono) esa
     definición pasaba a contar cada señal como una visita más e inflaba el
     número principal del panel sin que se notara. */
  function esVista(r){ var t=r.event_type||"pageview"; return t==="pageview"; }
  function esChat(r){ return String(r.event_type||"").indexOf("chat_")===0; }

  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  /* ───────────── Campañas (UTM) ─────────────
     Convención para las campañas semanales de LinkedIn:
       utm_source=linkedin  utm_medium=social
       utm_campaign=<nombre de la campaña>   ej. digital_twin_launch
       utm_content=post_<n>                  ej. post_1  (cada aviso)
       utm_term=<semana ISO>                 ej. 2026-w32 (para cortar por semana)
     El tracker ya guarda los cinco en r.params (web/assets/track.js). */
  var UTM_KEYS=["utm_source","utm_medium","utm_campaign","utm_content","utm_term"];

  function utm(r,k){ return (r.params&&r.params[k])||""; }

  // Semana ISO: la campaña es semanal, así que es el corte natural.
  function isoWeek(d){
    var t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
    var dn=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-dn);
    var y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));
    var w=Math.ceil(((t-y0)/86400000+1)/7);
    return t.getUTCFullYear()+"-w"+(w<10?"0"+w:w);
  }
  function semanaDe(r){
    if(utm(r,"utm_term")) return utm(r,"utm_term");      // la que declaró la campaña
    var d=r.ts_iso?new Date(r.ts_iso):null;              // si no, la real de la visita
    return (d&&!isNaN(d))?isoWeek(d):"(n/d)";
  }
  function esCampania(r){ return !!(utm(r,"utm_campaign")||utm(r,"utm_source")); }

  /* Para comparar semanas se usa la fecha REAL de la visita, no el utm_term.
     Si se usara la etiqueta, una campaña mal rotulada movería tráfico de semana
     y la comparación mentiría. La etiqueta sirve para atribuir, no para medir. */
  function semanaReal(r){
    var d=r.ts_iso?new Date(r.ts_iso):null;
    return (d&&!isNaN(d))?isoWeek(d):"(n/d)";
  }
  function semanaPrevia(w){
    var m=String(w).match(/(\d{4})-w(\d{2})/); if(!m) return "";
    // Retrocede 7 días desde el jueves de esa semana (el jueves siempre cae en su propia semana ISO).
    var ene4=new Date(Date.UTC(+m[1],0,4));
    var jue=new Date(ene4); jue.setUTCDate(ene4.getUTCDate()-((ene4.getUTCDay()||7)-4)+(+m[2]-1)*7);
    jue.setUTCDate(jue.getUTCDate()-7);
    return isoWeek(jue);
  }

  function cabeceraSemana(rows){
    var vistas=rows.filter(esVista);
    var porSem={};
    vistas.forEach(function(r){ var w=semanaReal(r); porSem[w]=(porSem[w]||0)+1; });

    var wAct=isoWeek(new Date()), wAnt=semanaPrevia(wAct);
    var act=porSem[wAct]||0, ant=porSem[wAnt]||0;
    var nro=parseInt(wAct.split("-w")[1],10);

    var veredicto, color;
    if(!ant){
      veredicto="Sin semana previa con datos para comparar."; color="#93a3b8";
    } else {
      var d=act-ant, pct=Math.round(d*100/ant);
      if(d>0){ veredicto="▲ "+d+" visitas más que la semana "+parseInt(wAnt.split("-w")[1],10)+" (+"+pct+"%)"; color="#4ade80"; }
      else if(d<0){ veredicto="▼ "+Math.abs(d)+" visitas menos que la semana "+parseInt(wAnt.split("-w")[1],10)+" ("+pct+"%)"; color="#f87171"; }
      else { veredicto="= igual que la semana "+parseInt(wAnt.split("-w")[1],10); color="#fbbf24"; }
    }

    return '<div style="background:linear-gradient(90deg,#0b1220,#111827);border:1px solid #1f2937;'+
      'border-radius:10px;padding:1rem 1.2rem;margin-bottom:1rem;display:flex;flex-wrap:wrap;'+
      'align-items:baseline;gap:.5rem 1.2rem">'+
      '<div style="font-size:1.5rem;font-weight:700;color:#e5e7eb">🗓 Semana '+nro+'</div>'+
      '<div class="muted" style="font-size:.85rem">'+esc(wAct)+'</div>'+
      '<div style="margin-left:auto;text-align:right">'+
        '<div style="font-size:1.5rem;font-weight:700;color:#e5e7eb">'+act+' <span style="font-size:.8rem;font-weight:400;color:#93a3b8">visitas</span></div>'+
        '<div style="font-size:.85rem;font-weight:600;color:'+color+'">'+esc(veredicto)+'</div>'+
      '</div>'+
    '</div>';
  }

  /* ───────────── Chat: quién pinchó y no habló ─────────────
     El embudo del chat tiene tres escalones y el interesante es el del medio:
       abrió (chat_foco) → escribió (chat_tipeo) → habló (chat_envio)
     Quien llegó al segundo y no al tercero mostró intención y se arrepintió.
     Ese es el lead caliente, y hasta ahora era invisible: el panel sólo veía a
     los que hablaban, que son justamente los que no hace falta detectar.

     Se agrupa por visitor_id (el id persistente que el tracker guarda en el
     localStorage del visitante), no por IP: la IP cambia de red en red y junta
     a gente distinta detrás del mismo NAT corporativo. */
  function embudoChat(rows){
    var porVisitante={};
    rows.filter(esChat).forEach(function(r){
      var v=r.visitor_id||"(sin id)";
      var e=porVisitante[v]||(porVisitante[v]={
        visitor_id:v, foco:0, tipeo:0, envio:0, abandono:0,
        borrador:0, ultima:"", pais:"", ciudad:"", campania:"", pagina:""
      });
      var t=r.event_type;
      if(t==="chat_foco") e.foco++;
      else if(t==="chat_tipeo") e.tipeo++;
      else if(t==="chat_envio") e.envio++;
      else if(t==="chat_abandono"){ e.abandono++; e.borrador=Math.max(e.borrador, r.chat_borrador_chars||0); }
      if((r.ts_iso||"")>e.ultima){
        e.ultima=r.ts_iso||"";
        e.pais=r.country||e.pais; e.ciudad=r.city||e.ciudad;
        e.pagina=r.page_title||r.page||e.pagina;
      }
      // La campaña la trae el pageview, no la señal de chat; se completa después.
      if(utm(r,"utm_content")) e.campania=utm(r,"utm_content");
    });

    // Atribución: pegarle a cada visitante la campaña con la que entró.
    var campPorVisitante={};
    rows.filter(esVista).forEach(function(r){
      var c=utm(r,"utm_content")||utm(r,"utm_campaign")||utm(r,"utm_source");
      if(c && r.visitor_id) campPorVisitante[r.visitor_id]=c;
    });
    Object.keys(porVisitante).forEach(function(v){
      if(!porVisitante[v].campania && campPorVisitante[v]) porVisitante[v].campania=campPorVisitante[v];
    });

    var todos=Object.keys(porVisitante).map(function(v){ return porVisitante[v]; });
    return {
      // Escribió y no mandó: el más caliente de los tres.
      arrepentidos: todos.filter(function(e){ return e.tipeo && !e.envio; })
                         .sort(function(a,b){ return (b.ultima>a.ultima)?1:-1; }),
      // Abrió el campo y ni escribió.
      curiosos:     todos.filter(function(e){ return e.foco && !e.tipeo && !e.envio; })
                         .sort(function(a,b){ return (b.ultima>a.ultima)?1:-1; }),
      hablaron:     todos.filter(function(e){ return e.envio; })
    };
  }

  function tablaChat(rows){
    var f=embudoChat(rows);
    var abrieron=f.arrepentidos.length+f.curiosos.length+f.hablaron.length;
    if(!abrieron) return "";

    function fila(e, calor){
      var cuando=e.ultima?e.ultima.slice(0,16).replace("T"," "):"—";
      var lugar=[e.ciudad,e.pais].filter(Boolean).join(", ")||"—";
      return '<tr>'+
        '<td>'+calor+'</td>'+
        '<td><code style="font-size:.78rem">'+esc(e.visitor_id)+'</code></td>'+
        '<td>'+esc(e.campania||"(sin campaña)")+'</td>'+
        '<td>'+esc(lugar)+'</td>'+
        '<td>'+esc(cuando)+'</td>'+
        '<td>'+(e.borrador?e.borrador+' car.':'—')+'</td>'+
      '</tr>';
    }

    var filas=f.arrepentidos.map(function(e){ return fila(e,'🔥 escribió y no mandó'); })
      .concat(f.curiosos.map(function(e){ return fila(e,'👀 sólo abrió'); })).join("");

    var silenciosos=f.arrepentidos.length+f.curiosos.length;
    var tasa=abrieron?Math.round(f.hablaron.length*100/abrieron):0;

    return '<div class="bd" style="margin-bottom:1.5rem">'+
      '<h3>💬 Chat — quién pinchó y no habló</h3>'+
      '<div class="cards" style="margin-bottom:1rem">'+
        '<div class="card"><div class="n" style="color:#f87171">'+f.arrepentidos.length+'</div>'+
          '<div class="l">Escribieron y no mandaron</div></div>'+
        '<div class="card"><div class="n" style="color:#fbbf24">'+f.curiosos.length+'</div>'+
          '<div class="l">Abrieron y ni escribieron</div></div>'+
        '<div class="card"><div class="n" style="color:#4ade80">'+f.hablaron.length+'</div>'+
          '<div class="l">Hablaron</div></div>'+
        '<div class="card"><div class="n">'+tasa+'%</div>'+
          '<div class="l">Convierten a mensaje</div></div>'+
      '</div>'+
      (silenciosos
        ? '<div class="tablewrap" style="max-height:32vh"><table><thead><tr>'+
            '<th>Señal</th><th>Visitante</th><th>Campaña</th><th>Dónde</th>'+
            '<th>Cuándo</th><th>Borrador</th></tr></thead>'+
          '<tbody>'+filas+'</tbody></table></div>'+
          '<div class="muted" style="font-size:.78rem;margin-top:.6rem">'+
            'Del borrador se guarda sólo el largo, nunca el texto. '+
            'El visitante es un id anónimo del navegador; cruzalo con la campaña para saber a quién escribirle.</div>'
        : '<div class="row"><span>Todos los que abrieron el chat terminaron hablando.</span></div>')+
    '</div>';
  }

  /* Cruce semana × post: la campaña se mide por semana Y por aviso. */
  function tablaSemanaPost(camp){
    if(!camp.length) return '';
    var celdas={}, semanas={}, posts={};
    camp.forEach(function(r){
      if(!esVista(r)) return;                               // visitas, no clicks ni señales de chat
      // Semana por fecha REAL, igual que la cabecera: si se usara la etiqueta,
      // los dos números no coincidirían y uno de los dos estaría mintiendo.
      var w=semanaReal(r), p=utm(r,"utm_content")||"(sin aviso)";
      semanas[w]=1; posts[p]=1;
      celdas[w+"|"+p]=(celdas[w+"|"+p]||0)+1;
    });
    var ws=Object.keys(semanas).sort(), ps=Object.keys(posts).sort();
    if(!ws.length) return '';
    var th=ps.map(function(p){ return '<th>'+esc(p)+'</th>'; }).join("");
    var totalPrev=null;
    var body=ws.map(function(w){
      var fila=0;
      var tds=ps.map(function(p){ var n=celdas[w+"|"+p]||0; fila+=n;
        return '<td style="text-align:center">'+(n||"·")+'</td>'; }).join("");
      var delta="";
      if(totalPrev!==null && totalPrev>0){
        var d=fila-totalPrev, pct=Math.round(d*100/totalPrev);
        delta=' <span style="color:'+(d>0?"#4ade80":d<0?"#f87171":"#fbbf24")+'">'+
              (d>0?"▲ +":d<0?"▼ ":"= ")+(d===0?"":Math.abs(pct)+"%")+'</span>';
      }
      totalPrev=fila;
      return '<tr><td><b>'+esc(w)+'</b></td>'+tds+'<td style="text-align:center"><b>'+fila+'</b>'+delta+'</td></tr>';
    }).join("");
    return '<div class="bd" style="margin-bottom:1rem"><h3>📅 Visitas por semana y por aviso</h3>'+
      '<div style="overflow-x:auto"><table style="width:100%;font-size:.85rem">'+
      '<thead><tr><th>Semana</th>'+th+'<th>Total</th></tr></thead><tbody>'+body+'</tbody></table></div>'+
      '<div class="muted" style="font-size:.75rem;margin-top:.45rem">'+
        'La semana es la de la <b>fecha real de la visita</b>, no la etiqueta de la campaña: '+
        'un aviso mal rotulado no corre las visitas de semana. El % compara con la fila de arriba.</div></div>';
  }

  function tally(rows,fn){
    var m={}; rows.forEach(function(r){ var k=fn(r)||"(n/d)"; m[k]=(m[k]||0)+1; });
    return Object.keys(m).map(function(k){return {k:k,n:m[k]};}).sort(function(a,b){return b.n-a.n;});
  }

  function breakdown(title,items,total){
    var rows=items.slice(0,8).map(function(it){
      var pct=total?Math.round(it.n*100/total):0;
      return '<div class="row"><span>'+esc(it.k)+'</span><b>'+it.n+'</b></div>'+
             '<div class="bar" style="width:'+pct+'%"></div>';
    }).join("");
    return '<div class="bd"><h3>'+title+'</h3>'+(rows||'<div class="row">Sin datos</div>')+'</div>';
  }

  function devPill(t){
    var c=t==="Celular"?"cel":(t==="Tablet"?"tab":"pc");
    return '<span class="pill '+c+'">'+esc(t||"?")+'</span>';
  }
  function evBadge(t){
    if(t==="click") return '<span class="pill tab">👆 click</span>';
    return '<span class="pill pc">👁 página</span>';
  }

  /* ───────────── Generador de links de campaña ─────────────
     Los UTM hay que escribirlos igual siempre: "Post_1" y "post_1" son dos
     campañas distintas para cualquier analítica. Por eso se generan acá y no
     se tipean a mano en cada aviso. */
  var DESTINOS=[
    ["https://jjuri-socialmining.github.io/_DemoCustomerOps/Dashboard_GemeloDigital_SIGMA.html","Dashboard Gemelo Digital"],
    ["https://jjuri-socialmining.github.io/_DemoCustomerOps/Dashboard_GemeloDigital_ADR_SIGMA.html","Dashboard Planta ADR"],
    ["https://jjuri-socialmining.github.io/_DemoCustomerOps/","Home del workspace"],
    ["https://jjuri-socialmining.github.io/_DemoCustomerOps/bienvenida.html","Landing de bienvenida"],
    ["https://sigmaops.ai/demo","sigmaops.ai/demo (cuando el dominio esté)"]
  ];

  function slug(s){
    return String(s||"").toLowerCase().trim()
      .normalize("NFD").replace(/[̀-ͯ]/g,"")   // sin tildes
      .replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"");
  }

  /* La semana lleva su propio normalizador: slug() convertiría "2026-W32" en
     "2026_w32", y la semana que el panel deduce de la fecha es "2026-w32". Con
     dos formas, la misma semana caía en dos grupos del desglose. */
  function normWeek(s){
    var m=String(s||"").match(/(\d{4})\D*w?\D*(\d{1,2})/i);
    if(!m) return slug(s);
    return m[1]+"-w"+(m[2].length<2?"0"+m[2]:m[2]);
  }

  function armarLink(){
    var g=function(id){ var e=document.getElementById(id); return e?e.value:""; };
    var base=g("u_base"), camp=slug(g("u_camp")), cont=slug(g("u_cont")), wk=normWeek(g("u_week"));
    if(!base) return "";
    var p=[["utm_source","linkedin"],["utm_medium","social"]];
    if(camp) p.push(["utm_campaign",camp]);
    if(cont) p.push(["utm_content",cont]);
    if(wk)   p.push(["utm_term",wk]);
    var qs=p.map(function(kv){ return kv[0]+"="+encodeURIComponent(kv[1]); }).join("&");
    return base+(base.indexOf("?")>=0?"&":"?")+qs;
  }

  function builderHTML(){
    var wk=isoWeek(new Date());
    // La numeración del aviso sigue a la semana ISO: campaña 32 = semana 32.
    // Se autocompleta para no tener que acordarse cada lunes.
    var nro=parseInt(wk.split("-w")[1],10);
    var opts=DESTINOS.map(function(d){ return '<option value="'+esc(d[0])+'">'+esc(d[1])+'</option>'; }).join("");
    var inp='background:#111827;border:1px solid #374151;border-radius:6px;color:#e5e7eb;padding:.45rem .6rem;font-size:.85rem';
    return '<div class="bd" style="margin-bottom:1rem">'+
      '<h3>🔗 Link de campaña para el aviso de LinkedIn</h3>'+
      '<div style="display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:.6rem 0">'+
        '<select id="u_base" style="'+inp+';min-width:230px">'+opts+'</select>'+
        '<input id="u_camp" style="'+inp+'" placeholder="campaña" value="digital_twin_launch">'+
        '<input id="u_cont" style="'+inp+';width:110px" placeholder="aviso" value="post_'+nro+'">'+
        '<input id="u_week" style="'+inp+';width:110px" placeholder="semana" value="'+esc(wk)+'">'+
        '<button id="u_copy">⧉ Copiar</button>'+
      '</div>'+
      '<div id="u_out" style="word-break:break-all;font-size:.8rem;color:#93c5fd;'+
        'background:#0b1220;border:1px solid #1f2937;border-radius:6px;padding:.55rem .7rem"></div>'+
      '<div class="muted" style="font-size:.75rem;margin-top:.45rem">'+
        'Se normaliza a minúsculas y guiones bajos: «Post 1» y «post_1» tienen que ser la misma campaña, no dos.</div>'+
    '</div>';
  }

  function render(){
    var todas=state.rows;                       // todo lo que hay en la colección
    var rows=todas.filter(trasElCorte);         // lo que se muestra, tras el corte
    var ocultas=todas.length-rows.length;
    var total=rows.length;
    var pageviews=rows.filter(esVista);
    var clicks=rows.filter(function(r){return r.event_type==="click";});
    var uniq=Object.keys(rows.reduce(function(a,r){a[r.visitor_id||r.ip||Math.random()]=1;return a;},{})).length;
    var ret=rows.filter(function(r){return r.returning;}).length;
    var countries=tally(rows,function(r){return r.country;});
    var devices=tally(rows,function(r){return r.device_label||r.device_type;});
    var browsers=tally(rows,function(r){return r.browser;});
    var refs=tally(rows,function(r){return (r.params&&(r.params.utm_source))||r.referrer;});
    var pages=tally(pageviews,function(r){return r.page_title||r.page||r.page_url;});
    var clickTargets=tally(clicks,function(r){return r.target_label||r.target_text||r.target_href;});

    var head=
      '<header>'+
        '<h1>📊 Panel de Visitas</h1>'+
        '<span class="muted">'+total+' registros'+(state._loading?' · actualizando…':'')+
          (ocultas?' <span style="color:#fbbf24">· '+ocultas+' antes del corte, ocultos</span>':'')+
          '<span id="vivochip" style="margin-left:.6rem"></span></span>'+
        '<span class="sp"></span>'+
        '<label style="font-size:.8rem;color:#93a3b8;display:inline-flex;align-items:center;gap:.35rem;margin-right:.4rem">'+
          '<input type="checkbox" id="b_vivo"'+(state.vivo?' checked':'')+'> En vivo</label>'+
        '<button id="b_corte" title="El panel ignora todo lo anterior a este momento. No borra nada.">'+
          (corte()?'↺ Quitar corte':'⌫ Empezar de 0')+'</button>'+
        '<button id="b_refresh">↻ Actualizar</button>'+
        '<button id="b_csv">⤓ CSV</button>'+
        '<button id="b_archivo" title="Respaldo íntegro en JSON, para archivar antes de vaciar">⤓ Archivo JSON</button>'+
        '<button id="b_vaciar" style="border-color:#f87171;color:#fca5a5" '+
          'title="Baja el respaldo y después vacía la hoja de visitas. El backend deja una copia y la verifica antes de borrar.">'+
          '🗑 Respaldar y vaciar</button>'+
        '<button id="b_logout">Salir</button>'+
      '</header>';

    if(total===0){
      app.innerHTML=head+'<main><div class="center">Aún no hay visitas registradas.<br>'+
        'Comparte el link de captura y vuelve a actualizar.</div></main>';
      wire(); return;
    }

    var cards=
      '<div class="cards">'+
        '<div class="card"><div class="n">'+pageviews.length+'</div><div class="l">Visitas (páginas)</div></div>'+
        '<div class="card"><div class="n">'+clicks.length+'</div><div class="l">Clicks</div></div>'+
        '<div class="card"><div class="n">'+uniq+'</div><div class="l">Visitantes únicos</div></div>'+
        '<div class="card"><div class="n">'+ret+'</div><div class="l">Retornos</div></div>'+
        '<div class="card"><div class="n">'+countries.length+'</div><div class="l">Países</div></div>'+
      '</div>';

    /* ---- bloque de campañas: solo el tráfico que viene etiquetado ---- */
    var camp=rows.filter(esCampania);
    var campHTML='';
    if(camp.length){
      var campUniq=Object.keys(camp.reduce(function(a,r){a[r.visitor_id||r.ip||Math.random()]=1;return a;},{})).length;
      var campClicks=camp.filter(function(r){return r.event_type==="click";}).length;
      campHTML=
        '<div class="cards" style="margin-top:0">'+
          '<div class="card"><div class="n">'+camp.length+'</div><div class="l">Registros de campaña</div></div>'+
          '<div class="card"><div class="n">'+campUniq+'</div><div class="l">Únicos de campaña</div></div>'+
          '<div class="card"><div class="n">'+campClicks+'</div><div class="l">Clicks de campaña</div></div>'+
          '<div class="card"><div class="n">'+Math.round(camp.length*100/total)+'%</div><div class="l">Del tráfico total</div></div>'+
        '</div>'+
        '<div class="breakdowns">'+
          breakdown("📣 Campaña (utm_campaign)",tally(camp,function(r){return utm(r,"utm_campaign");}),camp.length)+
          breakdown("📝 Aviso (utm_content)",tally(camp,function(r){return utm(r,"utm_content");}),camp.length)+
          breakdown("🗓 Semana",tally(camp,semanaDe),camp.length)+
          breakdown("📡 Fuente (utm_source)",tally(camp,function(r){return utm(r,"utm_source");}),camp.length)+
        '</div>';
    } else {
      campHTML='<div class="bd" style="margin-bottom:1rem"><h3>📣 Campañas</h3>'+
        '<div class="row"><span>Todavía no llegó ninguna visita etiquetada con UTM. '+
        'Generá el link acá abajo y usalo en el aviso de LinkedIn.</span></div></div>';
    }

    var bds='<div class="breakdowns">'+
      breakdown("📄 Páginas más visitadas",pages,pageviews.length)+
      breakdown("👆 Clicks más populares (qué les llama la atención)",clickTargets,clicks.length)+
      breakdown("🌎 País",countries,total)+
      breakdown("📱 Dispositivo",devices,total)+
      breakdown("🧭 Navegador",browsers,total)+
      breakdown("🔗 Origen / Campaña",refs,total)+
    '</div>';

    // Campos combinados para una tabla compacta (el detalle completo va al CSV)
    rows.forEach(function(r){
      r._what = r.event_type==="click" ? (r.target_label||r.target_text||r.target_href||"")
                                       : (r.page_title||r.page||"");
      r._loc  = [r.city, r.country].filter(Boolean).join(", ");
      r._nav  = [r.browser, r.os].filter(Boolean).join(" · ");
      r._ip   = r.ipv4 || r.ip || "";   // IPv4 legible; cae a la geo-IP (puede ser IPv6) si no hay
    });

    var cols=[
      ["ts_iso","Fecha"],["event_type","Evento"],["_what","Qué"],
      ["device_label","Dispositivo"],["_loc","Ubicación"],["_ip","IP"],["_nav","Navegador / SO"]
    ];

    var f=state.filter.toLowerCase();
    var view=rows.filter(function(r){
      if(!f) return true;
      return JSON.stringify(r).toLowerCase().indexOf(f)>=0;
    }).slice().sort(function(a,b){
      var x=a[state.sortKey], y=b[state.sortKey];
      if(x==null)x=""; if(y==null)y="";
      return (x>y?1:x<y?-1:0)*state.sortDir;
    });

    var thead=cols.map(function(c){
      var arrow=state.sortKey===c[0]?(state.sortDir>0?" ▲":" ▼"):"";
      return '<th data-k="'+c[0]+'">'+c[1]+arrow+'</th>';
    }).join("");

    var body=view.map(function(r){
      var dt=r.ts_iso?new Date(r.ts_iso):null;
      var when=dt?(dt.toLocaleDateString()+" "+dt.toLocaleTimeString().slice(0,5)):esc(r.ts_local||"");
      return '<tr>'+
        '<td>'+esc(when)+'</td>'+
        '<td>'+evBadge(r.event_type)+'</td>'+
        '<td>'+esc(r._what)+'</td>'+
        '<td>'+esc(r.device_label||"")+' '+devPill(r.device_type)+'</td>'+
        '<td>'+esc(r._loc)+'</td>'+
        '<td class="muted">'+esc(r._ip||"—")+'</td>'+
        '<td>'+esc(r._nav)+'</td>'+
      '</tr>';
    }).join("");

    /* Ya no existen las lecturas a medias: una carga trae todo o falla entera.
       Lo único que puede quedar afuera es una fila cuyo _json se haya corrompido. */
    var warn = state._fails ? '<div style="background:#3a1d1d;border:1px solid #f87171;color:#fca5a5;'+
      'border-radius:8px;padding:.6rem .9rem;margin-bottom:1rem;font-size:.85rem">⚠ '+state._fails+
      ' fila(s) de la planilla tienen el JSON ilegible y quedaron fuera del reporte. '+
      'Revisá la columna <b>_json</b> en la hoja «visitas».</div>' : '';
    app.innerHTML=head+'<main>'+warn+cabeceraSemana(rows)+cards+campHTML+
      tablaSemanaPost(camp)+tablaChat(rows)+builderHTML()+bds+
      '<div class="toolbar">'+
        '<input id="f" type="text" placeholder="Filtrar (país, IP, ciudad, campaña…)" value="'+esc(state.filter)+'">'+
        '<span class="muted">'+view.length+' de '+total+'</span>'+
      '</div>'+
      '<div class="tablewrap"><table><thead><tr>'+thead+'</tr></thead><tbody>'+body+'</tbody></table></div>'+
    '</main>';
    wire();
  }

  function toCSV(){
    var rows=state.rows; if(!rows.length) return "";
    var keys=["ts_iso","ts_local","event_type","page","page_title","page_url",
      "target_label","target_text","target_href","visitor_id","visit_count","returning","device_label","device_type",
      "os","browser","browser_version","ip","ipv4","ip_type","country","country_code","region","city","postal",
      "latitude","longitude","isp","org","asn","geo_timezone","timezone","language","screen","viewport",
      "pixel_ratio","cpu_cores","device_memory_gb","touch_points","net_type","referrer","landing_url",
      "user_agent","geo_source"];
    var utm=["utm_source","utm_medium","utm_campaign","utm_term","utm_content"];
    var head=keys.concat(utm).join(",");
    var lines=rows.map(function(r){
      var cells=keys.map(function(k){ return q(r[k]); });
      var p=r.params||{};
      utm.forEach(function(u){ cells.push(q(p[u])); });
      return cells.join(",");
    });
    return head+"\n"+lines.join("\n");
    function q(v){ if(v==null)return ""; v=String(v).replace(/"/g,'""'); return /[",\n]/.test(v)?'"'+v+'"':v; }
  }

  /* ── Modo en vivo ────────────────────────────────────────────────
     Relee la planilla cada POLL_MS. Ahora una vuelta en vivo es UN request que
     trae todo, así que el intervalo lo fija el sentido común y no un rate limit:
     30 s alcanza de sobra para mirar entrar una campaña. */
  var POLL_MS=30000, pollTimer=null;

  function tictac(){
    var c=document.getElementById("vivochip"); if(!c) return;
    if(!state.vivo){ c.textContent=""; return; }
    var s=Math.round((Date.now()-(state.ultima||Date.now()))/1000);
    c.innerHTML='<span style="color:#4ade80">● en vivo</span> <span class="muted">· hace '+s+' s</span>';
  }

  function vivoOn(on){
    state.vivo=on;
    try{ localStorage.setItem("__sigma_report_vivo", on?"1":"0"); }catch(e){}
    if(pollTimer){ clearInterval(pollTimer); pollTimer=null; }
    if(on){ pollTimer=setInterval(function(){ if(!state._loading) load(true); }, POLL_MS); }
  }

  function wire(){
    var r=document.getElementById("b_refresh"); if(r) r.onclick=function(){ load(); };

    var v=document.getElementById("b_vivo"); if(v) v.onchange=function(){ vivoOn(v.checked); tictac(); };
    tictac();

    var bv=document.getElementById("b_vaciar"); if(bv) bv.onclick=respaldarYVaciar;

    var bc=document.getElementById("b_corte"); if(bc) bc.onclick=function(){
      if(corte()){ try{ localStorage.removeItem(LS_CUT); }catch(e){} render(); return; }
      try{ localStorage.setItem(LS_CUT, new Date().toISOString()); }catch(e){}
      render();
    };
    var lo=document.getElementById("b_logout"); if(lo) lo.onclick=clearKey;
    var cs=document.getElementById("b_csv"); if(cs) cs.onclick=function(){
      var blob=new Blob([toCSV()],{type:"text/csv;charset=utf-8"});
      var a=document.createElement("a");
      a.href=URL.createObjectURL(blob);
      a.download="visitas_"+new Date().toISOString().slice(0,10)+".csv";
      a.click();
    };
    /* Una sola implementación del respaldo: antes esto repetía bajarArchivo()
       con su propia copia de la lógica, y las dos ya se habían desincronizado. */
    var ar=document.getElementById("b_archivo"); if(ar) ar.onclick=function(){ bajarArchivo();
    };

    /* Generador de links de campaña */
    var refrescarLink=function(){
      var o=document.getElementById("u_out"); if(o) o.textContent=armarLink();
    };
    ["u_base","u_camp","u_cont","u_week"].forEach(function(id){
      var e=document.getElementById(id); if(e){ e.oninput=refrescarLink; e.onchange=refrescarLink; }
    });
    refrescarLink();
    var cp=document.getElementById("u_copy"); if(cp) cp.onclick=function(){
      var url=armarLink(); if(!url) return;
      navigator.clipboard.writeText(url).then(function(){
        cp.textContent="✓ Copiado"; setTimeout(function(){ cp.textContent="⧉ Copiar"; },1500);
      }).catch(function(){ cp.textContent="⚠ Copiá a mano"; });
    };

    var f=document.getElementById("f"); if(f) f.oninput=function(){ state.filter=f.value; render();
      var nf=document.getElementById("f"); if(nf){ nf.focus(); nf.setSelectionRange(nf.value.length,nf.value.length);} };
    document.querySelectorAll("th[data-k]").forEach(function(th){
      th.onclick=function(){
        var k=th.getAttribute("data-k");
        if(state.sortKey===k) state.sortDir*=-1; else { state.sortKey=k; state.sortDir=1; }
        render();
      };
    });
  }

  /* ───────────── arranque ───────────── */
  setInterval(tictac,1000);                       // el "hace N s" corre solo
  if(localStorage.getItem(LS_TOK)&&localStorage.getItem(LS_URL)){
    load();
    if(state.vivo) vivoOn(true);                  // el modo en vivo sobrevive a la recarga
  } else gate();
})();
</script>
