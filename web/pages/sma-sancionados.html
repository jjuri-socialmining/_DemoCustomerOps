<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sancionados SMA · SIGMA</title>
<style>
:root{--paper:#F3F5F1;--surface:#FCFCFA;--surface-2:#EAEEE7;--ink:#16211F;--ink-soft:#4C5A56;--ink-faint:#75827E;--rule:#D7DCD3;--rule-soft:#E4E8DF;--accent:#0E5F55;--accent-soft:#D6E7E2;--signal:#B0431B;--signal-soft:#F3DFD5;--gold:#966C15;--gold-soft:#EFE4C8;--c-up:#0D9488;--c-down:#C2410C;--shadow:0 1px 2px rgba(22,33,31,.06);--f-display:"Avenir Next","Helvetica Neue",Helvetica,Arial,sans-serif;--f-body:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#0E1412;--surface:#161E1C;--surface-2:#1D2624;--ink:#E8ECE7;--ink-soft:#AEB8B3;--ink-faint:#7E8985;--rule:#2A3431;--rule-soft:#222B29;--accent:#7CC7B8;--accent-soft:#183430;--signal:#E8895C;--signal-soft:#3A2418;--gold:#D9B05A;--gold-soft:#332B15;--c-up:#22A394;--c-down:#E26A22;--shadow:0 1px 2px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--paper:#0E1412;--surface:#161E1C;--surface-2:#1D2624;--ink:#E8ECE7;--ink-soft:#AEB8B3;--ink-faint:#7E8985;--rule:#2A3431;--rule-soft:#222B29;--accent:#7CC7B8;--accent-soft:#183430;--signal:#E8895C;--signal-soft:#3A2418;--gold:#D9B05A;--gold-soft:#332B15;--c-up:#22A394;--c-down:#E26A22;--shadow:0 1px 2px rgba(0,0,0,.4)}
html{color-scheme:light dark}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
a:hover{border-bottom-color:var(--accent)}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(30px,5vw,46px);font-weight:700}
h2{font-size:clamp(22px,3vw,28px);font-weight:600;margin:0 0 6px}
h3{font-size:18px;font-weight:600}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
.masthead{border-bottom:1px solid var(--rule);background:var(--surface)}
.masthead .wrap{padding-top:22px;padding-bottom:22px}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-family:var(--f-display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint)}
.topline .dot{color:var(--signal)}
.themebtn{font-family:var(--f-display);font-size:12px;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--rule);background:var(--surface-2);color:var(--ink-soft);border-radius:999px;padding:5px 11px;cursor:pointer}
.lede{max-width:760px;color:var(--ink-soft);font-size:18px;margin:10px 0 0}
section{padding:28px 0 6px}
.kicker{font-family:var(--f-display);font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--signal);margin-bottom:6px}
.sub{color:var(--ink-soft);max-width:760px;margin:0 0 14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:18px 0 6px}
.tile{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.tile .k{font-family:var(--f-display);font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint)}
.tile .v{font-family:var(--f-display);font-size:26px;font-weight:700;letter-spacing:-.02em}
table{border-collapse:collapse;width:100%;font-family:var(--f-display);font-size:14px;background:var(--surface);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--rule-soft);vertical-align:top}
th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.n{white-space:nowrap}
td .url{font-family:var(--f-mono);font-size:12px;color:var(--ink-faint);word-break:break-all}
td .notas{font-family:var(--f-body);font-size:14px;color:var(--ink-soft)}
.ok{color:var(--c-up);font-weight:600}.bad{color:var(--c-down);font-weight:600}.off{color:var(--ink-faint)}
.tag{font-family:var(--f-display);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-soft);font-weight:600;white-space:nowrap}
.tag.bc{background:var(--accent-soft);color:var(--accent)}.tag.ca{background:var(--gold-soft);color:var(--gold)}.tag.cl{background:var(--signal-soft);color:var(--signal)}
.tblwrap{overflow-x:auto;margin-bottom:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px}
.chip{font-family:var(--f-display);font-size:13px;border:1px solid var(--rule);border-radius:999px;padding:3px 10px;background:var(--surface-2);color:var(--ink-soft)}
.chip b{color:var(--ink);font-weight:600}
.chip.pen{border-style:dashed;color:var(--ink-faint)}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow)}
form.add{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:10px}
form.add label{font-family:var(--f-display);font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);display:flex;flex-direction:column;gap:4px}
form.add input,form.add select,form.add textarea{font-family:var(--f-display);font-size:14px;padding:8px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink)}
form.add textarea{min-height:60px;resize:vertical}
form.add .full{grid-column:1/-1}
pre.cmd{font-family:var(--f-mono);font-size:12.5px;background:var(--surface-2);border:1px solid var(--rule);border-radius:10px;padding:12px 14px;white-space:pre-wrap;word-break:break-all;margin:10px 0 6px;color:var(--ink)}
.btn{font-family:var(--f-display);font-size:13px;border:1px solid var(--rule);background:var(--surface-2);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
.btn:hover{border-color:var(--ink-faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.hint{font-size:14px;color:var(--ink-soft)}
ol.steps{padding-left:22px;color:var(--ink-soft)}
ol.steps li{margin-bottom:6px}
footer{border-top:1px solid var(--rule);margin-top:30px;padding:18px 0 40px;font-family:var(--f-display);font-size:13px;color:var(--ink-faint)}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 12px}
.filters input,.filters select{font-family:var(--f-display);font-size:14px;padding:7px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--surface);color:var(--ink)}
.filters input{flex:1 1 220px;min-width:0}
.filters label{font-family:var(--f-display);font-size:13px;color:var(--ink-soft);display:flex;align-items:center;gap:5px}
.srv{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.srv .card h3{margin-bottom:6px}
.srv .card p{margin:0;color:var(--ink-soft);font-size:15px}
.srv .card .cnt{font-family:var(--f-display);font-size:13px;color:var(--ink-faint);margin-top:8px}
.score{font-family:var(--f-display);font-weight:700;font-size:15px}
.score.hi{color:var(--c-up)}.score.mid{color:var(--gold)}.score.lo{color:var(--ink-faint)}
td details summary{cursor:pointer;color:var(--ink-soft)}
td details ul{margin:6px 0 0;padding-left:18px;font-size:13px}
.tag.imp{background:var(--signal-soft);color:var(--signal)}
.nota ul{margin:10px 0 0;padding-left:18px}
.nota li{margin-bottom:4px}
.caveat{border-left:3px solid var(--gold);padding:4px 0 4px 12px;color:var(--ink-soft);max-width:780px}
.more{margin:10px 0}
.login{max-width:420px;padding-top:12vh}
.login form{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.login label{font-family:var(--f-display);font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);display:flex;flex-direction:column;gap:4px}
.login input{font-family:var(--f-display);font-size:15px;padding:9px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink)}
.fichas{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.ficha h3{margin-bottom:4px}
table.kv{border:0;background:transparent;font-size:13.5px}
table.kv th{background:transparent;width:32%;padding:5px 8px 5px 0;text-transform:none;letter-spacing:0;font-size:13px}
table.kv td{padding:5px 0;word-break:break-word}
</style></head>
<body>
<div id="app"><div class="wrap login"><div class="card">
<div class="kicker">SIGMA · acceso demo</div><h2>Sancionados por la SMA</h2>
<form id="lg"><label>Usuario<input id="lu" autocomplete="username" required></label>
<label>Clave<input id="lp" type="password" autocomplete="current-password" required></label>
<button class="btn primary">Entrar</button><div class="hint" id="lerr"></div></form></div></div></div>

<script>
const S={"ruido": "Monitoreo de ruido", "rca": "Matriz de compromisos RCA", "reportes": "Reportes automáticos a la SMA", "seia": "Prechequeo de ingreso al SEIA", "biomasa": "Tablero de producción vs. límite"};const Y=2026;let lim=60,D=[];
const $=id=>document.getElementById(id);
function e(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c])}
function n(u){return u.toLocaleString("es-CL",{maximumFractionDigits:1})}
function f(){const q=$("q").value.toLowerCase(),c=$("cat").value,r=$("reg").value,s=$("srv").value,rec=$("rec").checked,ni=$("noimp").checked;
return D.filter(x=>(!q||(x.nombre+" "+x.unidades.join(" ")+" "+x.exps.map(y=>y.expediente).join(" ")).toLowerCase().includes(q))
&&(!c||x.categorias.includes(c))&&(!r||x.regiones.includes(r))&&(!s||x.servicios.includes(s))&&(!rec||(x.ultimo||0)>=Y-2)&&(!ni||!x.uta_impaga))}
function draw(){const R=f();$("cuenta").textContent=R.length+" empresas";
$("tb").innerHTML=R.slice(0,lim).map(x=>{const cl=x.puntaje>=60?"hi":x.puntaje>=35?"mid":"lo";
const ex=x.exps.map(y=>`<li><a href="${e(y.ficha)}" target="_blank">${e(y.expediente)}</a> ${e(y.unidad)} — ${n(y.uta)} UTA · ${e(y.col7)}${y.impaga?' <span class="tag imp">impaga</span>':""}</li>`).join("");
return `<tr><td class="n"><span class="score ${cl}">${x.puntaje}</span></td>
<td><b>${e(x.nombre)}</b>${x.uta_impaga?' <span class="tag imp">pendiente de pago '+n(x.uta_impaga)+' UTA</span>':""}<details><summary>${x.n} expediente${x.n>1?"s":""}</summary><ul>${ex}</ul></details></td>
<td>${e(x.categorias.join(", "))}<div class="hint">${e(x.regiones.join(", "))}</div></td>
<td class="n">${n(x.uta)} UTA</td><td class="n">${x.ultimo||"—"}</td>
<td>${x.servicios.map(k=>'<span class="tag bc">'+e(S[k])+'</span>').join(" ")}</td></tr>`}).join("");
$("mas").style.display=R.length>lim?"":"none"}
function tg(){const r=document.documentElement,d=r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme: dark)").matches);r.dataset.theme=d?"light":"dark";try{localStorage.setItem("theme",r.dataset.theme)}catch(_){}}
try{const t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(_){}
function init(d){D=d;["q","cat","reg","srv","rec","noimp"].forEach(i=>$(i).addEventListener("input",()=>{lim=60;draw()}));
$("mas").onclick=()=>{lim+=100;draw()};draw()}
async function abrir(u,p){const o=JSON.parse(document.getElementById("sobre").textContent),B=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(u+":"+p),"PBKDF2",false,["deriveKey"]);
const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:B(o.s),iterations:250000,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
const t=await crypto.subtle.decrypt({name:"AES-GCM",iv:B(o.i)},k,B(o.c));const x=JSON.parse(new TextDecoder().decode(t));
document.getElementById("app").innerHTML=x.cuerpo;init(x.D)}
document.getElementById("lg").addEventListener("submit",async ev=>{ev.preventDefault();const u=$("lu").value.trim(),p=$("lp").value;
$("lerr").textContent="…";try{await abrir(u,p);try{sessionStorage.setItem("sma",JSON.stringify([u,p]))}catch(_){}}catch(_){$("lerr").textContent="Usuario o clave incorrectos."}});
try{const g=JSON.parse(sessionStorage.getItem("sma")||"null");if(g)abrir(g[0],g[1]).catch(()=>{})}catch(_){}
</script>
