<style>
  :root{--paper:#F4F6F5;--card:#fff;--ink:#14181B;--muted:#5C6866;--rule:#C3CCCA;--accent:#0B6E5F;--crit:#7E1D12}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --paper:#111517;--card:#181D20;--ink:#E9EFEE;--muted:#A7B4B7;--rule:#384346;--accent:#4FBFA8;--crit:#F09080}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex;align-items:center;justify-content:center;padding:24px;line-height:1.6}
  .caja{background:var(--card);border:1px solid var(--rule);border-radius:8px;
    padding:28px 26px;max-width:27rem;width:100%}
  h1{font-family:ui-serif,Georgia,serif;font-weight:600;font-size:26px;margin:0 0 8px}
  p{margin:0 0 16px;color:var(--muted);font-size:14.5px}
  input{width:100%;padding:12px 14px;font-size:16px;border:1px solid var(--rule);
    border-radius:6px;background:var(--paper);color:var(--ink);margin-bottom:12px}
  input:focus{outline:2px solid var(--accent);outline-offset:1px}
  button{width:100%;padding:12px;font-size:15px;font-weight:700;cursor:pointer;
    background:var(--accent);color:var(--paper);border:0;border-radius:6px}
  button[disabled]{opacity:.6;cursor:progress}
  .err{color:var(--crit);font-size:14px;min-height:20px;margin-top:10px}
</style>
</head>

</div>

<script>
const D=JSON.parse(document.getElementById('datos').textContent);
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
document.getElementById('f').addEventListener('submit',async ev=>{
  ev.preventDefault();
  const b=document.getElementById('b'), e=document.getElementById('e');
  b.disabled=true; b.textContent='Descifrando…'; e.textContent='';
  try{
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('c').value),'PBKDF2',false,['deriveKey']);
    const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(D.sal),iterations:D.iter,hash:'SHA-256'},
      base,{name:'AES-GCM',length:256},false,['decrypt']);
    const claro=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(D.iv)},k,b64(D.ct));
    /* Reemplazo del documento entero: la p&aacute;gina descifrada trae su propio
       <head>, sus estilos y sus scripts, y as&iacute; se ejecutan de verdad. */
    const html=new TextDecoder().decode(claro);
    document.open(); document.write(html); document.close();
  }catch(err){
    e.textContent='Clave incorrecta.';
    b.disabled=false; b.textContent='Abrir';
  }
});
</script>
